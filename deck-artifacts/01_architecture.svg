<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Pipeline architecture: four sources through scraping, merge, LLM tagging, coercion, aggregation, LLM synthesis, validation, reports">
  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="590" y="38" font-size="26" font-weight="bold" text-anchor="middle" fill="#111111">Pipeline Architecture — sources to report</text>

  <!-- Legend -->
  <rect x="770" y="58" width="18" height="18" fill="#0072B2" stroke="#023047"/>
  <text x="794" y="73" font-size="16" fill="#111111">Deterministic code</text>
  <rect x="960" y="58" width="18" height="18" fill="#E69F00" stroke="#7a5300"/>
  <text x="984" y="73" font-size="16" fill="#111111">LLM</text>

  <!-- arrow marker -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Row 1: sources -> scrapers -> merge -->
  <!-- Sources -->
  <rect x="40" y="110" width="210" height="90" rx="8" fill="#ffffff" stroke="#0072B2" stroke-width="2.5"/>
  <text x="145" y="140" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">4 public sources</text>
  <text x="145" y="163" font-size="14" text-anchor="middle" fill="#333333">App Store · Play Store</text>
  <text x="145" y="182" font-size="14" text-anchor="middle" fill="#333333">Reddit · YouTube</text>

  <!-- Scrapers -->
  <rect x="300" y="110" width="220" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="410" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Scrapers / ingestion</text>
  <text x="410" y="160" font-size="13" text-anchor="middle" fill="#eaf2fb">per-source public APIs</text>
  <text x="410" y="178" font-size="13" text-anchor="middle" fill="#eaf2fb">item-level keyword filter</text>

  <!-- Merge -->
  <rect x="570" y="110" width="220" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="680" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Merge + dedup</text>
  <text x="680" y="160" font-size="13" text-anchor="middle" fill="#eaf2fb">normalize 8 fields</text>
  <text x="680" y="178" font-size="13" text-anchor="middle" fill="#eaf2fb">drop &lt;8 chars, dup id/text</text>

  <!-- Pass 1 tagging (LLM) -->
  <rect x="840" y="110" width="300" height="90" rx="8" fill="#E69F00" stroke="#7a5300" stroke-width="2"/>
  <text x="990" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#000000">PASS 1 · LLM tagging</text>
  <text x="990" y="160" font-size="13" text-anchor="middle" fill="#3a2b00">batches of 8 · structured JSON</text>
  <text x="990" y="178" font-size="13" text-anchor="middle" fill="#3a2b00">4-model rotation → Gemini fallback</text>

  <!-- arrows row 1 -->
  <line x1="250" y1="155" x2="298" y2="155" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="520" y1="155" x2="568" y2="155" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="790" y1="155" x2="838" y2="155" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- down arrow from pass1 to coerce -->
  <line x1="990" y1="200" x2="990" y2="250" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Row 2 (right to left): Coerce -> Aggregation ; Aggregation -> Pass2 -->
  <!-- Coerce -->
  <rect x="840" y="260" width="300" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="990" y="288" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Coerce → controlled vocab</text>
  <text x="990" y="310" font-size="13" text-anchor="middle" fill="#eaf2fb">every field forced into vocab</text>
  <text x="990" y="328" font-size="13" text-anchor="middle" fill="#eaf2fb">invalid enum → safe default</text>

  <!-- Aggregation -->
  <rect x="490" y="260" width="300" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="640" y="288" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Aggregation (counts)</text>
  <text x="640" y="310" font-size="13" text-anchor="middle" fill="#eaf2fb">ALL frequencies &amp; %s here</text>
  <text x="640" y="328" font-size="13" text-anchor="middle" fill="#eaf2fb">deterministic, not LLM</text>

  <!-- Pass 2 synthesis (LLM) -->
  <rect x="140" y="260" width="300" height="90" rx="8" fill="#E69F00" stroke="#7a5300" stroke-width="2"/>
  <text x="290" y="288" font-size="17" font-weight="bold" text-anchor="middle" fill="#000000">PASS 2 · LLM synthesis</text>
  <text x="290" y="310" font-size="13" text-anchor="middle" fill="#3a2b00">1 call: cluster · quotes</text>
  <text x="290" y="328" font-size="13" text-anchor="middle" fill="#3a2b00">hypotheses (cite vocab themes)</text>

  <!-- arrows row 2 -->
  <line x1="838" y1="305" x2="792" y2="305" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="488" y1="305" x2="442" y2="305" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- down arrows to row 3 -->
  <line x1="290" y1="350" x2="290" y2="410" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="640" y1="350" x2="640" y2="410" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Row 3: Validation and Reports -->
  <!-- Validation -->
  <rect x="490" y="420" width="300" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="640" y="448" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Validation</text>
  <text x="640" y="470" font-size="13" text-anchor="middle" fill="#eaf2fb">evidence · triangulation</text>
  <text x="640" y="488" font-size="13" text-anchor="middle" fill="#eaf2fb">coverage · 30-item human check</text>

  <!-- Reports -->
  <rect x="140" y="420" width="300" height="90" rx="8" fill="#0072B2" stroke="#023047" stroke-width="2"/>
  <text x="290" y="448" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Reports &amp; UI</text>
  <text x="290" y="470" font-size="13" text-anchor="middle" fill="#eaf2fb">MD · PDF · XLSX</text>
  <text x="290" y="488" font-size="13" text-anchor="middle" fill="#eaf2fb">Streamlit dashboard</text>

  <!-- Aggregation also feeds Validation (already down-arrow at 640). Pass2 feeds Reports (290 down-arrow). Validation feeds Reports -->
  <line x1="488" y1="465" x2="442" y2="465" stroke="#333333" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="590" y="560" font-size="15" text-anchor="middle" fill="#555555">LLM touches only 2 of 9 stages (orange). Every reported number is computed in Python (blue).</text>
</svg>
